<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>House Price Prediction</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 16px;
        }

        h1 {
            text-align: center;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 16px;
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        input,
        textarea {
            width: 100%;
            padding: 6px 8px;
            box-sizing: border-box;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        button {
            padding: 10px 16px;
            cursor: pointer;
        }

        .result {
            text-align: center;
            font-size: 1.2rem;
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            background: #f3f4f6;
        }
    </style>
</head>

<body>
    <h1>House Price Predictor</h1>

    <form method="POST">
        <div>
            <label for="area">Area (sq ft)</label>
            <input type="number" step="1" min="200" name="area" id="area"
                value="{{ form_data.area if form_data and form_data.area is not none else '' }}" required>
        </div>

        <div>
            <label for="year_built">Year Built</label>
            <input type="number" step="1" min="1900" max="2025" name="year_built" id="year_built"
                value="{{ form_data.year_built if form_data and form_data.year_built is not none else '2000' }}"
                required>
        </div>

        <div class="full-width">
            <label for="location">Location</label>
            <input type="text" name="location" id="location" placeholder="e.g., Downtown, Suburb, Northside"
                value="{{ form_data.location if form_data and form_data.location is not none else '' }}" required>
        </div>

        <div class="full-width">
            <label for="condition">Condition</label>
            <input type="text" name="condition" id="condition" placeholder="e.g., Excellent, Good, Fair, Needs Work"
                value="{{ form_data.condition if form_data and form_data.condition is not none else '' }}" required>
        </div>

        <div class="full-width">
            <label for="garage">Garage</label>
            <input type="text" name="garage" id="garage" placeholder="e.g., Yes, No, 2-car, 1-car"
                value="{{ form_data.garage if form_data and form_data.garage is not none else '' }}" required>
        </div>

        <div>
            <label for="bedrooms">Bedrooms</label>
            <input type="number" min="0" step="1" name="bedrooms" id="bedrooms"
                value="{{ form_data.bedrooms if form_data else '' }}" required>
        </div>

        <div>
            <label for="bathrooms">Bathrooms</label>
            <input type="number" min="0" step="1" name="bathrooms" id="bathrooms"
                value="{{ form_data.bathrooms if form_data else '' }}" required>
        </div>

        <div>
            <label for="floors">Floors</label>
            <input type="number" min="1" step="1" name="floors" id="floors"
                value="{{ form_data.floors if form_data else '' }}" required>
        </div>


        <div class="full-width">
            <button type="submit">Predict Price</button>
        </div>
    </form>

    {% if prediction is not none %}
    <div class="result">
        Estimated House Price:
        <strong>${{ "{:,.2f}".format(prediction) }}</strong>
    </div>
    {% endif %}
</body>

</html>
