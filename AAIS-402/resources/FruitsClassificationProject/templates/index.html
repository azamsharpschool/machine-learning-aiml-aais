<!DOCTYPE html>
<html>
<head>
    <title>Fruit Classifier</title>
    <style>
        body {
            font-family: Arial;
            max-width: 600px;
            margin: 40px auto;
            text-align: center;
        }
        .preview-img {
            width: 250px;
            margin-top: 20px;
            border-radius: 10px;
        }
        input[type="file"] {
            margin-top: 20px;
        }
        button {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #4CAF50;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <h1>Fruit Image Classifier</h1>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" accept="image/*" required>
        <br>
        <button type="submit">Predict</button>
    </form>

    {% if image_url %}
        <h2>Uploaded Image:</h2>
        <img src="{{ image_url }}" class="preview-img">
    {% endif %}

    {% if prediction %}
        <h2>Prediction: {{ prediction }}</h2>
        <p>Confidence: {{ confidence | round(2) }}%</p>
    {% endif %}

</body>
</html>
